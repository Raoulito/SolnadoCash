[package]
name = "solnadocash"
version = "0.1.0"
description = "SolnadoCash privacy protocol — Groth16 ZK proofs + stealth addresses on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solnadocash"

[features]
# Remove the source filename and line from on-chain error logs. OFF by default: the code is
# public and the error number is in the transaction result regardless, so stripping hides nothing
# an attacker could not derive, while the file:line is what lets you locate a failure from a
# user's transaction. Enable for a deployment that would rather not publish the mapping.
strip-error-origins = []

no-entrypoint = []
# Declared because anchor's derive macros emit #[cfg(feature = "anchor-debug")];
# without it `cargo clippy -- -D warnings` fails on unexpected_cfgs.
anchor-debug = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
# Enable to run CU benchmarks (T11, T12)
benchmark = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang    = "0.32.1"
groth16-solana = "0.0.3"
solana-program = "1.18.26"

[dev-dependencies]
proptest = "1.5.0"
