[package]
name = "solnadocash"
version = "0.1.0"
description = "SolnadoCash privacy protocol — Groth16 ZK proofs + stealth addresses on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solnadocash"

[features]
# Remove the source filename and line from on-chain error logs.
#
# ON by default, and in `default` rather than opt-in on purpose. If stripping were opt-in, one
# forgotten flag on any future `anchor build && solana program deploy` would silently put the
# paths back, and nothing would fail to warn you. This way the default build is the one that is
# safe to deploy, and the failure mode of forgetting the flag is only that local debugging is
# harder.
#
# To get the file and line back while developing:
#   cargo build-sbf -- --no-default-features
strip-error-origins = []

no-entrypoint = []
# Declared because anchor's derive macros emit #[cfg(feature = "anchor-debug")];
# without it `cargo clippy -- -D warnings` fails on unexpected_cfgs.
anchor-debug = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = ["strip-error-origins"]
# Enable to run CU benchmarks (T11, T12)
benchmark = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang    = "0.32.1"
groth16-solana = "0.0.3"
solana-program = "1.18.26"

[dev-dependencies]
proptest = "1.5.0"
