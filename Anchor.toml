[toolchain]
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
solnadocash = "DMAPWBXb5w2KZkML2SyV2CtZDfbwNKqkWL3scQKXUF59"

[programs.devnet]
solnadocash = "DMAPWBXb5w2KZkML2SyV2CtZDfbwNKqkWL3scQKXUF59"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Invokes the ts-mocha declared in package.json devDependencies by explicit path rather than through
# `npx`. Both resolve the same binary here, but `npx` will silently fetch a package from the registry
# when it is not installed locally, so a broken install would run some other version instead of
# failing. The explicit path fails loudly.
#
# Note that `ts-mocha --version` reports mocha's version (9.2.2), not its own — ts-mocha 10.1.0 is
# what is installed.
test = "./node_modules/.bin/ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""
