# /etc/systemd/system/caddy.service.d/sornadocash.conf
# Gives Caddy the RPC provider key for the /rpc proxy. The file is root-only (0600); systemd reads
# it as root before dropping to the caddy user.
[Service]
EnvironmentFile=/etc/sornadocash/caddy.env
# The packaged unit runs `caddy run --environ`, which prints the whole environment, this key
# included, to the journal at every start. Same command without --environ.
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile
